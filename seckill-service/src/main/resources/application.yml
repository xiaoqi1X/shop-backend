server:
  port: 8087
spring:
  application:
    name: seckill-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hm-trade?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  redis:
    host: 192.168.150.102
    port: 6379
    database: 0
    timeout: 3000ms
  cloud:
    nacos:
      server-addr: 192.168.150.102
seckill:
  async:
    rocketmq:
      name-server: 192.168.150.102:9876
      request-topic: seckill_request_topic
      request-tag: seckill_request
      request-producer-group: seckill-service-request-producer-group
      request-consumer-group: seckill-service-request-consumer-group
      producer:
        send-timeout-ms: 3000
        retry-times-when-send-failed: 2
        retry-times-when-send-async-failed: 2
      request-consumer:
        consume-thread-min: 2
        consume-thread-max: 8
        consume-message-batch-max-size: 1
        consume-timeout-minutes: 15
        max-reconsume-times: 3
      order-consumer:
        consume-thread-min: 2
        consume-thread-max: 4
        consume-message-batch-max-size: 1
        consume-timeout-minutes: 15
        max-reconsume-times: 3
      order-topic: seckill_order_topic
      order-tag: seckill_order
      order-producer-group: seckill-service-order-producer-group
      order-consumer-group: seckill-service-order-consumer-group
    redis:
      activity-key-prefix: "seckill:activity:"
      stock-key-prefix: "seckill:stock:"
      users-key-prefix: "seckill:users:"
      result-key-prefix: "seckill:result:"
      result-ttl-seconds: 7200
    token-bucket:
      permits-per-second: 300
      burst-capacity: 300
    websocket:
      endpoint: /ws/seckill
    outbox:
      enabled: true
      scan-interval-ms: 5000
      batch-size: 100
      max-retry-count: 5
      retry-delay-seconds: 5
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: seckill-service
    description: "Seckill APIs"
    email: zhanghuyi@itcast.cn
    concat: hmall
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.seckill.controller
